# Ported from ~/.config/ghostty/config (2026-07-12)
font=JetBrainsMono Nerd Font Mono:size=10
bold-text-in-bright=yes

# Dracula Pro — Van Helsing variant (official, owned). Source of truth:
# ~/Downloads/Dracula Pro/themes/windows-terminal/dracula-pro-van-helsing.json
# Chosen 2026-07-12 over Tomorrow Night, stock Dracula, base Pro, and
# catppuccin-mocha (mocha's bright==regular rows made irssi unreadable).
# Cursor: intentionally NOT set — default inverse fg/bg preferred over the
# theme's 708CA9. Base-Pro deltas if ever switching back:
# bg/regular0 22212c, bright0 504c67, selection-background 454158.
[colors-dark]
background=0b0d0f
foreground=f8f8f2
selection-foreground=f8f8f2
selection-background=414d58
regular0=0b0d0f
regular1=ff9580
regular2=8aff80
regular3=ffff80
regular4=9580ff
regular5=ff80bf
regular6=80ffea
regular7=f8f8f2
bright0=364049
bright1=ffaa99
bright2=a2ff99
bright3=ffff99
bright4=aa99ff
bright5=ff99cc
bright6=99ffee
bright7=ffffff

[cursor]
style=underline

[mouse]
hide-when-typing=yes

[text-bindings]
# super+s sends C-s (tmux prefix); shift+enter sends ESC+CR (Claude Code newline)
\x13=Super+s
\x1b\x0d=Shift+Return
